# EXAMPLE: enable ONLY after verifying which CURRENT server block serves haesiivooja.fi.
# Do not replace the default server or blocks for app.haesiivooja.fi/cascadary.com.
# Match existing cert locations. Check with: sudo certbot certificates
server {
    listen 80;
    server_name haesiivooja.fi www.haesiivooja.fi;
    return 301 https://haesiivooja.fi$request_uri;
}
server {
    listen 443 ssl;
    server_name www.haesiivooja.fi;
    ssl_certificate /etc/letsencrypt/live/haesiivooja.fi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/haesiivooja.fi/privkey.pem;
    return 301 https://haesiivooja.fi$request_uri;
}
server {
    listen 443 ssl;
    server_name haesiivooja.fi;
    ssl_certificate /etc/letsencrypt/live/haesiivooja.fi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/haesiivooja.fi/privkey.pem;
    root /var/www/haesiivooja-astro/current;
    index index.html;
    charset utf-8;

    # No PHP, WordPress or old WordPress API reachable through this domain.
    location = /wp-login.php { return 404; }
    location ^~ /wp-admin/ { return 404; }
    location ^~ /wp-json/ { return 404; }
    location ~* \.php(?:/|$) { return 404; }
    location / { try_files $uri $uri/ =404; }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location ~* \.(?:css|js|png|jpg|jpeg|webp|avif|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Add tested 301s for old WordPress URLs that aren't preserved as static pages.
    # e.g. location = /support/ { return 301 /yhteystiedot/; }
}
